[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Oude taallinks (?lang=en) naar de nieuwe taaladressen
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true
  query = {lang = "en"}

[[redirects]]
  from = "/"
  to = "/de/"
  status = 301
  force = true
  query = {lang = "de"}
